{% extends "base.html" %}

{% block title %}{{ titre_page }}{% endblock %}

{% block content %}

<section class="form-page">

    <h1>{{ titre_page }}</h1>

    <form method="POST" enctype="multipart/form-data" class="item-form">

        <div class="form-group">
            <label for="title">Titre</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="120"
                required
                placeholder="Ex : Clés avec porte-clés bleu"
            >
        </div>

        <div class="form-group">
            <label for="category">Catégorie</label>

            <select id="category" name="category" required>
                <option value="">-- Choisir une catégorie --</option>

                {% for category in categories %}
                    <option value="{{ category }}">
                        {{ category }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                id="description"
                name="description"
                rows="4"
                required
                placeholder="Couleur, marque, signes distinctifs..."
            ></textarea>
        </div>

        <div class="form-group">

            <label for="date_event">
                {% if item_type == "lost" %}
                    Date de la perte
                {% else %}
                    Date de la découverte
                {% endif %}
            </label>

            <input
                type="date"
                id="date_event"
                name="date_event"
                required
            >

        </div>

        <div class="form-group">
            <label for="location">Lieu</label>

            <select id="location" name="location" required>
                <option value="">-- Choisir un lieu --</option>

                {% for location in locations %}
                    <option value="{{ location }}">
                        {{ location }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="photo">Photo (facultatif)</label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/png,image/jpeg,image/webp"
            >
        </div>

        <button type="submit" class="btn btn-primary">

            {% if item_type == "lost" %}
                Déclarer l'objet perdu
            {% else %}
                Déclarer l'objet trouvé
            {% endif %}

        </button>

    </form>

</section>

{% endblock %}
