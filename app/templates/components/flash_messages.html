{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="auth-alerts" role="status" aria-live="polite">
            {% for category, message in messages %}
                <p class="auth-alert auth-alert-{{ category }}">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
