<article class="item-card">
    <a class="item-card-image-link" href="{{ url_for('items.item_detail', item_id=item.id) }}"
       aria-label="Voir les détails de {{ item.title }}">
        {% if item.photo %}
            <img src="{{ url_for('static', filename='uploads/' + item.photo) }}"
                 alt="{{ item.title }}" loading="lazy">
        {% else %}
            <span class="item-card-placeholder" aria-hidden="true">
                <svg viewBox="0 0 48 48" focusable="false">
                    {% if item.item_type == "lost" %}
                        <circle cx="21" cy="21" r="13"></circle>
                        <path d="m31 31 9 9"></path>
                    {% else %}
                        <path d="m10 25 9 9 19-20"></path>
                        <circle cx="24" cy="24" r="20"></circle>
                    {% endif %}
                </svg>
            </span>
        {% endif %}
    </a>

    <div class="item-card-content">
        <span class="badge {{ 'badge-blue' if item.item_type == 'lost' else 'badge-green' }}">
            {{ 'Objet perdu' if item.item_type == 'lost' else 'Objet trouvé' }}
        </span>
        <h3><a href="{{ url_for('items.item_detail', item_id=item.id) }}">{{ item.title }}</a></h3>
        <p class="item-card-description">{{ item.description }}</p>
        <div class="item-card-meta">
            <span>⌖ {{ item.location }}</span>
            <time datetime="{{ item.event_date.isoformat() }}">{{ item.event_date.strftime('%d/%m/%Y') }}</time>
        </div>
        <a href="{{ url_for('items.item_detail', item_id=item.id) }}" class="item-card-link">
            Voir les détails <span aria-hidden="true">→</span>
        </a>
    </div>
</article>
