<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>{{ titre_page }}</title>
  </head>
  <body>
    <h1>{{ titre_page }}</h1>

    <form method="post">
      <label for="title">Titre</label><br />
      <input id="title" name="title" type="text" required /><br /><br />

      <label for="description">Description</label><br />
      <textarea id="description" name="description" rows="5" required></textarea><br /><br />

      <label for="category">Catégorie</label><br />
      <select id="category" name="category" required>
        <option value="Électronique">Électronique</option>
        <option value="Documents">Documents</option>
        <option value="Clés">Clés</option>
        <option value="Bagagerie">Bagagerie</option>
        <option value="Autre">Autre</option>
      </select><br /><br />

      <label for="location">Lieu</label><br />
      <input id="location" name="location" type="text" required /><br /><br />

      <label for="date_event">Date</label><br />
      <input id="date_event" name="date_event" type="date" required /><br /><br />

      <button type="submit">Déclarer</button>
    </form>
  </body>
</html>
