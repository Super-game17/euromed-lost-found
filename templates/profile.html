<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Profil - Euromed Lost & Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Euromed Lost & Found</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-danger" href="{{ url_for('main.logout') }}">Se déconnecter</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h3>Mon Profil Utilisateur (Groupe 1)</h3>
                        <hr>
                        <p><strong>Prénom :</strong> {{ user.prenom }}</p>
                        <p><strong>Nom :</strong> {{ user.nom }}</p>
                        <p><strong>Email :</strong> {{ user.email }}</p>
                        
                        <div class="alert alert-info mt-4">
                            <strong>Note :</strong> Ton module d'authentification est complet ! Les autres groupes pourront l'utiliser pour lier leurs objets.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
